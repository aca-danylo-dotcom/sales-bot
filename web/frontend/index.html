<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>CRM</title>
  <!-- Тема ставится ДО отрисовки, обычным скриптом в <head>, а не из React.
       Иначе тот, у кого выбрана тёмная, при каждом заходе получал бы вспышку
       белой страницы: разметка появляется позже, чем браузер красит фон.
       Значение то же, что читает src/lib/theme.ts, — ключ менять только вместе
       с ним. -->
  <script>
    try {
      if (localStorage.getItem("crm-theme") === "dark") {
        document.documentElement.classList.add("dark");
      }
    } catch (error) {
      /* приватный режим запрещает localStorage — тогда просто светлая тема */
    }
  </script>
  <!-- Мост в Telegram. Скрипт обязан грузиться ДО приложения и только с
       telegram.org: свою копию положить нельзя — Telegram подменяет её на
       рабочую версию клиента, а старая просто не свяжется с приложением.

       В обычном браузере скрипт тоже загрузится, но window.Telegram.WebApp
       окажется пустышкой без initData — по этому признаку панель и понимает,
       что открыта на компьютере, а не в мессенджере (см. src/lib/telegram.ts). -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
