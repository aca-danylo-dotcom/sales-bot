{% extends "base.html" %}
{% block title %}Вход в CRM{% endblock %}
{% block main_class %}center{% endblock %}

{% block content %}
<form class="card login" method="post" action="/login">
  <h1>Вход в CRM</h1>

  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}

  <label>
    Логин
    <input type="text" name="login" value="{{ login|default('') }}"
           autocomplete="username" autofocus required>
  </label>

  <label>
    Пароль
    <input type="password" name="password" autocomplete="current-password" required>
  </label>

  <input type="hidden" name="next" value="{{ next|default('/') }}">
  <button type="submit">Войти</button>

  <p class="hint">Доступ заводит владелец магазина в админке бота.</p>
</form>
{% endblock %}
